name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: gofmt
        run: |
          $files = gofmt -l .
          if ($files) { $files; exit 1 }
        shell: pwsh

      - run: go vet ./...

      # Catches a build-tagged file that only compiles on its own OS.
      - name: vet the other platform
        run: go vet ./...
        env:
          GOOS: ${{ matrix.os == 'windows-latest' && 'darwin' || 'windows' }}
          GOARCH: arm64

      # -short skips the tests that call live APIs.
      - run: go test -short ./...

      - run: go build ./...
