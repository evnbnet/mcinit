name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - run: gofmt -l . && if ($(gofmt -l .)) { exit 1 }
        shell: pwsh
        name: gofmt

      - run: go vet ./...

      # -short skips the checks that call the real PaperMC, Purpur and Adoptium
      # APIs, so a CI run never fails because an upstream service is down. The
      # live checks are meant to be run locally before a release.
      - run: go test -short ./...

      - run: go build ./...
