name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - run: gofmt -l . && if ($(gofmt -l .)) { exit 1 }
        shell: pwsh
        name: gofmt

      - run: go vet ./...

      - run: go test -short ./...

      - run: go build ./...
