name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Both platforms mcinit ships for. The macOS runner is the only place the
    # Unix-only code paths — the fcntl lock probe, the start.command script,
    # the archive install — actually execute.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: gofmt
        run: |
          $files = gofmt -l .
          if ($files) { $files; exit 1 }
        shell: pwsh

      - run: go vet ./...

      # Vet the other platform too, so a build-tagged file that only compiles
      # on its own OS is caught on either runner.
      - name: vet the other platform
        run: go vet ./...
        env:
          GOOS: ${{ matrix.os == 'windows-latest' && 'darwin' || 'windows' }}
          GOARCH: arm64

      # -short skips the checks that call the real PaperMC, Purpur and Adoptium
      # APIs, so a CI run never fails because an upstream service is down.
      - run: go test -short ./...

      - run: go build ./...
