<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="mcinit banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2ea043"/>
      <stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="#21262d" stroke-width="1" opacity="0.5">
    <path d="M0 80 H1280 M0 160 H1280 M0 240 H1280"/>
    <path d="M320 0 V320 M640 0 V320 M960 0 V320"/>
  </g>

  <!-- terminal window -->
  <g transform="translate(90,78)">
    <rect x="0" y="0" width="260" height="164" rx="14" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <rect x="0" y="0" width="260" height="34" rx="14" fill="#21262d"/>
    <circle cx="22" cy="17" r="6" fill="#ff5f56"/>
    <circle cx="44" cy="17" r="6" fill="#ffbd2e"/>
    <circle cx="66" cy="17" r="6" fill="#27c93f"/>
    <text x="18" y="74" font-family="Consolas, 'Courier New', monospace" font-size="22" fill="#7ee787">$ mcinit new my-server</text>
    <text x="18" y="108" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#8b949e">creating server...</text>
    <text x="18" y="138" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#58a6ff">done ✓</text>
  </g>

  <text x="400" y="145" font-family="Segoe UI, system-ui, sans-serif" font-size="86" font-weight="700" fill="#f0f6fc" filter="url(#glow)">mcinit</text>
  <text x="402" y="190" font-family="Segoe UI, system-ui, sans-serif" font-size="26" fill="#8b949e">Minecraft server setup, like npm create</text>

  <rect x="400" y="215" width="380" height="6" rx="3" fill="url(#accent)"/>

  <text x="400" y="262" font-family="Consolas, 'Courier New', monospace" font-size="20" fill="#7ee787">go install · single .exe · no admin rights</text>
</svg>