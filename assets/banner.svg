<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="mcinit banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2ea043"/>
      <stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>

  <!-- pixel grass block -->
  <g transform="translate(90,90)" shape-rendering="crispEdges">
    <rect x="0" y="0" width="32" height="32" fill="#5b8737"/>
    <rect x="32" y="0" width="32" height="32" fill="#6aab3f"/>
    <rect x="64" y="0" width="32" height="32" fill="#5b8737"/>
    <rect x="96" y="0" width="32" height="32" fill="#7bc44a"/>
    <rect x="0" y="32" width="32" height="32" fill="#8b5a2b"/>
    <rect x="32" y="32" width="32" height="32" fill="#7a4f26"/>
    <rect x="64" y="32" width="32" height="32" fill="#8b5a2b"/>
    <rect x="96" y="32" width="32" height="32" fill="#7a4f26"/>
    <rect x="0" y="64" width="32" height="32" fill="#8b5a2b"/>
    <rect x="32" y="64" width="32" height="32" fill="#6e4420"/>
    <rect x="64" y="64" width="32" height="32" fill="#8b5a2b"/>
    <rect x="96" y="64" width="32" height="32" fill="#7a4f26"/>
    <rect x="0" y="96" width="32" height="32" fill="#7a4f26"/>
    <rect x="32" y="96" width="32" height="32" fill="#8b5a2b"/>
    <rect x="64" y="96" width="32" height="32" fill="#6e4420"/>
    <rect x="96" y="96" width="32" height="32" fill="#8b5a2b"/>
  </g>

  <!-- terminal prompt -->
  <g transform="translate(260,118)" font-family="Consolas, 'Courier New', monospace" font-size="40" fill="#58a6ff">
    <text x="0" y="0">$</text>
  </g>

  <text x="300" y="150" font-family="Segoe UI, system-ui, sans-serif" font-size="78" font-weight="700" fill="#f0f6fc">mcinit</text>
  <text x="302" y="195" font-family="Segoe UI, system-ui, sans-serif" font-size="26" fill="#8b949e">Minecraft server setup, like npm create</text>

  <rect x="300" y="220" width="360" height="6" rx="3" fill="url(#accent)"/>

  <text x="300" y="270" font-family="Consolas, 'Courier New', monospace" font-size="20" fill="#7ee787">mcinit new my-server</text>
</svg>