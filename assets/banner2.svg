<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="mcinit banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2ea043"/>
      <stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="#21262d" stroke-width="1" opacity="0.5">
    <path d="M0 80 H1280 M0 160 H1280 M0 240 H1280"/>
    <path d="M320 0 V320 M640 0 V320 M960 0 V320"/>
  </g>

  <text x="120" y="145" font-family="Segoe UI, system-ui, sans-serif" font-size="86" font-weight="700" fill="#f0f6fc">mcinit</text>
  <text x="122" y="190" font-family="Segoe UI, system-ui, sans-serif" font-size="26" fill="#8b949e">Minecraft server setup, like npm create</text>

  <rect x="120" y="215" width="380" height="6" rx="3" fill="url(#accent)"/>

  <text x="120" y="262" font-family="Consolas, 'Courier New', monospace" font-size="24" fill="#7ee787">mcinit new my-server</text>
</svg>