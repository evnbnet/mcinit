version: 2

project_name: mcinit

before:
  hooks:
    - go mod tidy
    - go test -short ./...

builds:
  - id: mcinit
    main: .
    binary: mcinit
    env:
      - CGO_ENABLED=0
    goos:
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/evanb/mcinit/internal/buildinfo.Version={{ .Version }}

archives:
  - id: mcinit
    # tar.gz on macOS preserves the execute bit; a zip would drop it.
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # install.ps1 and install.sh look the archive up by this exact name.
    name_template: "mcinit_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

homebrew_casks:
  - name: mcinit
    binaries:
      - mcinit
    homepage: "https://github.com/evnbnet/mcinit"
    description: "Set up a Minecraft server on localhost with one command"
    # Unsigned binary: without this the first run dies on Gatekeeper.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr",
                           args: ["-dr", "com.apple.quarantine", "#{staged_path}/mcinit"]
          end
    repository:
      owner: evnbnet
      name: homebrew-tap
      # Needs a PAT with write access to the tap, not GITHUB_TOKEN.
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  draft: false
  prerelease: auto
  name_template: "mcinit {{ .Tag }}"
  footer: |
    ## Install

    **Windows**

    ```powershell
    irm https://github.com/evnbnet/mcinit/releases/latest/download/install.ps1 | iex
    ```

    **macOS**

    ```sh
    curl -fsSL https://github.com/evnbnet/mcinit/releases/latest/download/install.sh | sh
    ```

    Or with Homebrew:

    ```sh
    brew install evnbnet/tap/mcinit
    ```

    Then open a new terminal so that `mcinit` is on the PATH.
  extra_files:
    - glob: install.ps1
    - glob: install.sh
