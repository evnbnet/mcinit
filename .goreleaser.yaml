version: 2

project_name: mcinit

before:
  hooks:
    - go mod tidy
    # -short skips the live API checks; a release must not fail because
    # PaperMC or Adoptium is having a bad afternoon.
    - go test -short ./...

builds:
  - id: mcinit
    main: .
    binary: mcinit
    env:
      - CGO_ENABLED=0
    goos:
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/evanb/mcinit/internal/buildinfo.Version={{ .Version }}

archives:
  - id: mcinit
    # Zip on Windows, tar.gz on macOS: what each platform's tools expect, and
    # tar.gz preserves the execute bit that a zip would drop.
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # install.ps1 and install.sh look the archive up by this exact name.
    name_template: "mcinit_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# A cask rather than a formula: goreleaser deprecated `brews` because a
# formula that just drops a pre-built binary in place is what a cask is for.
homebrew_casks:
  - name: mcinit
    # Only the binary. Java is installed by mcinit itself at run time, because
    # which version is needed depends on the Minecraft version the user picks.
    binaries:
      - mcinit
    homepage: "https://github.com/evnbnet/mcinit"
    description: "Set up a Minecraft server on localhost with one command"

    # The binary is not signed or notarised, so Gatekeeper quarantines it and
    # the first run dies with "cannot be opened". install.sh clears the flag
    # itself; the cask has to do the same.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr",
                           args: ["-dr", "com.apple.quarantine", "#{staged_path}/mcinit"]
          end

    # Requires a public repository called homebrew-tap on this account;
    # goreleaser commits the cask there on every release.
    #
    # If you stop publishing a tap, delete this whole block — otherwise the
    # release fails looking for the token below.
    repository:
      owner: evnbnet
      name: homebrew-tap
      # Not GITHUB_TOKEN: the token Actions provides is scoped to the
      # repository running the workflow, so it cannot push to another one.
      # This needs a personal access token with write access to the tap,
      # stored as the HOMEBREW_TAP_TOKEN secret.
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  draft: false
  prerelease: auto
  name_template: "mcinit {{ .Tag }}"
  footer: |
    ## Install

    **Windows**

    ```powershell
    irm https://github.com/evnbnet/mcinit/releases/latest/download/install.ps1 | iex
    ```

    **macOS**

    ```sh
    curl -fsSL https://github.com/evnbnet/mcinit/releases/latest/download/install.sh | sh
    ```

    Or with Homebrew:

    ```sh
    brew install evnbnet/tap/mcinit
    ```

    Then open a new terminal so that `mcinit` is on the PATH.
  extra_files:
    - glob: install.ps1
    - glob: install.sh
